packages:
  - apps/*
  - packages/*

# Only these packages may run dependency build scripts.
allowBuilds:
  # Reviewed binary downloader; source-map upload tooling is not used.
  '@sentry/cli': false
  esbuild: true
  lightningcss: true
  supabase: true

minimumReleaseAgeExclude:
  - expo-dev-client@58.0.16
  - expo-dev-launcher@58.0.16
  - expo-dev-menu@58.0.12
